<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>metre number</title>
    <link href="metre.js">
</head>
<style>
.container{
    justify-content:block;
    text-align:center;
    width:360px;
    height:180px;
    margin:200px;
    padding:20px;
    padding-left:50%;
    border-radius:20px;
    background-color:blueviolet;
    box-shadow:rgb(208, 95, 95);
    font-weight:bold;
    font-size:16px;

}
.accountholder{
    justify-content:block;
    padding:20px;
    margin:10px;
    border-radius:10px;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.metre{
    justify-content: block;
    padding:11px;
    
    border-radius:10px;

}
.acc{
    transition:initial;
    border-radius:10px;
}
.button{
    padding:5px;
    margin:10px;
    margin-right:10px;
    margin-bottom:10px;
    justify-content:center;
    text-align:center;
    border-radius:10px;
    transform:5s ease-in-out;
}
</style>
<body>
    <form class="container">
    <h2>Metre Number Box</h2>
    <div class="accountholder">
    <label for="Account Holder">Account Holder:</label>
    <input type="text" id="accountholder" placeholder ="Account Holder" class="acc">
    </div>

    <div>
    <label class="metre" for="Metre number">Metre Number:</label>
    <input type="number" id="metreNumber" placeholder="Metre Number" class="acc">
    </div>
    <div>
        <button class="button" for="submit">Submit</button>
    </div>
    </form>
    <script>
        
    document.getElementById('submit').addEventListener('click',function(event){
        event,preventDefault();
        var accountholder=getElementById('accountholder').value
        var metreNumber=getElementById('metreNumber').value
        if(accountholder==="Mr Khumalo" && metreNumber==="0781468560"){
            alert("Successful")
        }else{
            alert("Try again")
        }
    })
    </script>
</body>
</html>
